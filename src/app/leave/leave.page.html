<ion-header>
  <ion-toolbar>
    <ion-back-button defaultHref="home" slot="start"></ion-back-button>
    <ion-title>Leave Permission</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Date -->
<ion-content>
  <div class="container">
    <h4 style="text-align: justify">Request your leave details down below </h4>
    <form action="">
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label position="fixed" >Start Date</ion-label>
            <ion-datetime  placeholder="From" displayFormat="MM/DD/YYYY"></ion-datetime>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
            <ion-label position="fixed" >End Date</ion-label>
            <ion-datetime  placeholder="To" displayFormat="MM/DD/YYYY" ></ion-datetime>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label position="fixed" >Start Time</ion-label>
            <ion-datetime  placeholder="From" displayFormat="hh:mm:ss A" ></ion-datetime>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
            <ion-label position="fixed" >End Time</ion-label>
            <ion-datetime  placeholder="To" displayFormat="hh:mm:ss A" ></ion-datetime>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
      <ion-text>
        Give your reason for taking a leave
      </ion-text>
      </ion-row>
      <ion-item class="ion-margin">
        <ion-textarea rows="6" cols="15" placeholder="Reason"></ion-textarea>
      </ion-item>
      <ion-row>
        <ion-col size="6"> 
          <ion-button  color="warning">
            <b>CANCEL</b>
          </ion-button>
        </ion-col>
        <ion-col size="6">
          <ion-button  color="secondary" class="ion-float-right">
            <b>SEND</b>
          </ion-button>
        </ion-col>
        </ion-row>
    </form>
  </div>
</ion-content>
