<ion-header>
  <ion-toolbar>
    <ion-back-button (click)="closeModal()" slot="start"></ion-back-button>
    <ion-title>Update Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="memberForm">
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="id" type="text" placeholder="Member Id"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="firstname" type="text" placeholder="First Name"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="lastname" type="text" placeholder="Last Name"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="email" type="email" placeholder="Email"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="password" type="text" placeholder="Password"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="department" type="text" placeholder="Department"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="designation" type="text" placeholder="Designation"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input formControlName="salary" type="number" placeholder="Salary"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-select formControlName="perUnitTime" interface="popover" placeholder="per unit time">
          <ion-select-option value="hr">per hour</ion-select-option>
          <ion-select-option value="min">per minute</ion-select-option>
          <ion-select-option value="sec">per second</ion-select-option>
        </ion-select>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="4">
        <ion-item>
          <ion-label>Shift Timings:</ion-label>
        </ion-item>
      </ion-col>
      <ion-col size="4">
        <ion-item>
          <ion-datetime [pickerOptions]="shiftStartPicker" (ionChange)="shiftStartChange()" [(ngModel)]="shiftStartNg" formControlName="shiftStart" placeholder="From" displayFormat="hh:mm A"></ion-datetime>
        </ion-item>
      </ion-col>
      <ion-col size="4">
        <ion-item>
          <ion-datetime [pickerOptions]="shiftEndPicker" (ionChange)="shiftEndChange()" [(ngModel)]="shiftEndNg" formControlName="shiftEnd" placeholder="To" displayFormat="hh:mm A"></ion-datetime>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-label>Shift:</ion-label>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-item>
            <ion-select formControlName="shift" class="shift-popover" interface="popover" placeholder="Select Shift">
              <ion-select-option value="first">First</ion-select-option>
              <ion-select-option value="second">Second</ion-select-option>
              <ion-select-option value="third">Third</ion-select-option>
              <ion-select-option value="morning">Morning</ion-select-option>
              <ion-select-option value="afternoon">Afternoon</ion-select-option>
              <ion-select-option value="evening">Evening</ion-select-option>
              <ion-select-option value="night">Night</ion-select-option>
              <ion-select-option value="midnight">Midnight</ion-select-option>
              <ion-select-option value="graveyard">Graveyard</ion-select-option>
              <ion-select-option value="split">Split</ion-select-option>
              <ion-select-option value="swing">Swing</ion-select-option>
              <ion-select-option value="rotating">Rotating</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-item>
      </ion-col>
    </ion-row>
    <br>
    <ion-row>
      <ion-col size="6">
        <ion-button color="warning" (click)="closeModal()" [disabled]="!memberForm.valid"
         shape="round" class="ion-float-right">
          Cancel
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button (click)="updateMember()" [disabled]="!memberForm.valid" 
          shape="round">
          Update
        </ion-button>
      </ion-col>
    </ion-row>
  </form>
</ion-content>
