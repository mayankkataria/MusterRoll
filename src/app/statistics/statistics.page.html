<ion-header>
  <ion-toolbar>
    <ion-back-button slot="start" defaultHref="tabs/admin-home"></ion-back-button>
    <ion-title>Statistics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label>From</ion-label>
    <ion-datetime [(ngModel)]="fromDate" (ionChange)="getStatsRange()" display-format="DD/MM/YYYY"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>To</ion-label>
    <ion-datetime [(ngModel)]="toDate" (ionChange)="getStatsRange()" display-format="DD/MM/YYYY"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>Status</ion-label>
    <ion-select [(ngModel)]="label" value="absentees" (ionChange)="getStatsRange()" interface="popup" placeholder="Status">
      <ion-select-option value="absentees">Absentees</ion-select-option>
      <ion-select-option value="lateComers">Late Comers</ion-select-option>
      <ion-select-option value="earlyLeavers">Early Leavers</ion-select-option>
    </ion-select>
  </ion-item>
  <div class="bar-chart">
    <canvas #barChart>
    </canvas>
  </div>
  <ion-list *ngIf="stats$ | async as stats">
    <h2 class="ion-margin">{{ label | titlecase }}</h2>
    <ion-item *ngFor="let statItem of stats; let i=index">
      <ion-label>
        <h2>
          <ion-icon slot="start" name="calendar-outline"></ion-icon> {{ dateStringLabels[0] }}
        </h2>
        <p *ngIf="label === 'absentees'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.absentees }}
        </p>
        <p *ngIf="label === 'lateComers'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.lateComers }} 
        </p>
        <p *ngIf="label === 'earlyLeavers'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.earlyLeavers }} 
        </p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
