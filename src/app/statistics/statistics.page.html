<ion-header>
  <ion-toolbar>
    <ion-title>Statistics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="single-stats" >
        <ion-icon name="pie-chart"></ion-icon>
        <ion-label>Single</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="multiple-stats">
        <ion-icon name="bar-chart"></ion-icon>
        <ion-label>Multiple</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs> 
</ion-content>
