  <ion-item>
    <ion-label>Date</ion-label>
    <ion-datetime [(ngModel)]="date" (ionChange)="getDateStat()" display-format="DD/MM/YYYY"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>Chart</ion-label>
    <ion-select [(ngModel)]="chartTypeVal" value="pie" placeholder="Select Chart">
      <ion-select-option value="pie">Pie</ion-select-option>
      <ion-select-option value="doughnut">Doughnut</ion-select-option>
      <ion-select-option value="bar">Bar</ion-select-option>
    </ion-select>
  </ion-item>

  <div>
    <canvas baseChart style="margin-top: 80px;width: 100%" [colors]="chartColors" [data]="pieChartData" [labels]="pieChartLabels"
      [chartType]="chartTypeVal">
    </canvas>
  </div>

  <ion-grid fixed>
    <ion-row class="ion-align-items-center">
      <ion-col>
        <!-- <ion-label class="ion-text-center" color="success">Presentees: </ion-label> -->
        <ion-text class="ion-text-center" color="success" expand="block" fill="clear" shape="round">
          Presentees: <b>{{ this.presentees }}</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <!-- <ion-label class="ion-text-center" color="success">Presentees: </ion-label> -->
        <ion-text color="danger" expand="block" fill="clear" shape="round">
          Absentees: <b>{{ this.absentees }}</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <!-- <ion-label class="ion-text-center" color="success">Presentees: </ion-label> -->
        <ion-text color="primary" expand="block" fill="clear" shape="round">
          Early Leavers: {{ this.earlyLeavers }}
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <!-- <ion-label class="ion-text-center" color="success">Presentees: </ion-label> -->
        <ion-text color="warning" expand="block" fill="clear" shape="round">
          Late Comers: {{ this.lateComers }}
        </ion-text>
      </ion-col>
    </ion-row>
  </ion-grid>
