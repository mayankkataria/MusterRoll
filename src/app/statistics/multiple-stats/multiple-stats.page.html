
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="circles"
      refreshingText="Refreshing...">
    </ion-refresher-content>
  </ion-refresher>
  
  <ion-item>
    <ion-label>From</ion-label>
    <ion-datetime [(ngModel)]="fromDate" (ionChange)="getStatsRange()" display-format="DD/MM/YYYY"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>To</ion-label>
    <ion-datetime [(ngModel)]="toDate" (ionChange)="getStatsRange()" display-format="DD/MM/YYYY"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label>Status</ion-label>
    <ion-select [(ngModel)]="label" multiple=true value="absentees" (ionChange)="getStatsRange()" interface="popup" placeholder="Status">
      <!-- <ion-select-option value="all">All</ion-select-option> -->
      <ion-select-option value="presentees">Presentees</ion-select-option>
      <ion-select-option value="absentees">Absentees</ion-select-option>
      <ion-select-option value="lateComers">Late Comers</ion-select-option>
      <ion-select-option value="earlyLeavers">Early Leavers</ion-select-option>
    </ion-select>
  </ion-item>
  <ion-item>
    <ion-label>Chart</ion-label>
    <ion-select [(ngModel)]="chartTypeVal" (ionChange)="getStatsRange()" value="bar" placeholder="Select Chart">
      <ion-select-option value="bar">Bar</ion-select-option>
      <ion-select-option value="line">Line</ion-select-option>
      <ion-select-option value="area">Area</ion-select-option>
      <!-- <ion-select-option *ngIf="label === 'all'" value="group-line">Grouped Line</ion-select-option>
      <ion-select-option *ngIf="label === 'all'" value="group-area">Grouped Area</ion-select-option> -->
    </ion-select>
  </ion-item>
  <div (click)="canvasClicked()" style="position: relative; height:50vh; width:100vw">
    <canvas #chartView id="canvas">
    </canvas>
  </div>
  <ion-list *ngIf="label.length === 1 && stats$ | async as stats">
    <h2 class="ion-margin">{{ label[0] | titlecase }}</h2>
    <ion-item *ngFor="let statItem of stats; let i=index">
      <ion-label>
        <h2>
          <ion-icon slot="start" name="calendar-outline"></ion-icon> {{ dateStringLabels[i] }}
        </h2>
        <p *ngIf="label[0] === 'presentees'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.presentees }}
        </p>
        <p *ngIf="label[0] === 'absentees'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.absentees }}
        </p>
        <p *ngIf="label[0] === 'lateComers'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.lateComers }} 
        </p>
        <p *ngIf="label[0] === 'earlyLeavers'">
          <ion-icon slot="start" name="people"></ion-icon> {{ statItem.earlyLeavers }} 
        </p>
      </ion-label>
    </ion-item>
  </ion-list>
<!-- </ion-content> -->
