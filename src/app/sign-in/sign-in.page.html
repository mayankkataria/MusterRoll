<ion-content>
  <div class="div">
    <ion-img class="logo" src="assets/logo2.png"></ion-img>
    <ion-label class="sign">Sign In</ion-label>
      <ion-list>
        <ion-item>
          <ion-label></ion-label>
           <ion-icon name="mail" slot="start"></ion-icon>
           <ion-input [(ngModel)]="email" type="email" placeholder="Email">
           </ion-input>
        </ion-item>
        <ion-item>
         <ion-label></ion-label>
          <ion-icon name="lock-closed" slot="start"></ion-icon>
          <ion-input [(ngModel)]="password" type="password" placeholder="Password" (keyup.enter)="signIn()">
          </ion-input>
       </ion-item>
      </ion-list>
  <!-- </div> -->
    <div class="button">
      <ion-row>
        <ion-col size="6">
          <ion-button expand="full" [routerLink]="['/register']" color="secondary" fill="outline" shape="round">
            Register
          </ion-button>
        </ion-col>
        <ion-col size="6">
          <ion-button  expand="full" (click)="signIn()" color="primary" fill="outline" shape="round">
            Sign In
          </ion-button>
        </ion-col>
      </ion-row>
    </div>
  </div>
</ion-content>
