<ion-content>
  <super-tabs>

    <super-tabs-toolbar color="white" slot="bottom">

      <super-tab-button id="icon">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </super-tab-button>

      <super-tab-button id="icon" *ngIf="userRole === 'admin'" >
        <ion-icon name="stats-chart"></ion-icon>
        <ion-label>Statistics</ion-label>
      </super-tab-button>

      <super-tab-button id="icon">
        <ion-icon name="people"></ion-icon>
        <ion-label>Members</ion-label>
      </super-tab-button>

      <super-tab-button id="icon">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profile</ion-label>
      </super-tab-button>

    </super-tabs-toolbar>

    <super-tabs-container>

      <super-tab>
        <ion-content>
          <!-- Home -->
          <ion-nav [root]="home"></ion-nav>
        </ion-content>
      </super-tab>

      <super-tab *ngIf="userRole === 'admin'">
        <ion-content>
          <!-- Statistics -->
          <ion-nav [root]="statistics"></ion-nav>
        </ion-content>
      </super-tab>

      <super-tab>
        <ion-content>
          <!-- members -->
          <ion-nav [root]="members"></ion-nav>
        </ion-content>
      </super-tab>


      <super-tab>
        <ion-content>
          <!-- profile -->
          <ion-nav [root]="profile"></ion-nav>
        </ion-content>
      </super-tab>
      
    </super-tabs-container>

  </super-tabs> 
</ion-content>
