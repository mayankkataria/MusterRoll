<ion-content>
  <super-tabs>

    <super-tabs-toolbar color="medium" [slot]="plt.is('desktop') ? 'top' : 'bottom'" style="display: flex;width: 100%;">
      
      <!-- <div style="width: 50%;display: flex;"> -->
        <!-- <div style="width: 25%;"> -->
          <super-tab-button id="icon" style="justify-content: center;">
            <!-- <ion-grid> -->
              <ion-row class="tabs-styling">
                <ion-icon class="icon-styling" style="margin-right:5px;color: white;" name="home"></ion-icon>
                <ion-label color="light">Home</ion-label>
              </ion-row>
            <!-- </ion-grid> -->
          </super-tab-button>
        <!-- </div> -->
  
        <!-- <div style="width: 25%;"  *ngIf="userRole === 'admin'"> -->
          <super-tab-button id="icon" *ngIf="userRole === 'admin'" style="justify-content: center;">
            <ion-row class="tabs-styling">
              <ion-icon class="icon-styling" color="light" style="margin-right:5px" name="stats-chart"></ion-icon>
              <ion-label color="light">Statistics</ion-label>
            </ion-row>
          </super-tab-button>
        <!-- </div> -->
  
        <!-- <div style="width: 25%;"> -->
          <super-tab-button id="icon" style="justify-content: center;">
            <ion-row class="tabs-styling">
              <ion-icon class="icon-styling" color="light" style="margin-right:5px" name="people"></ion-icon>
              <ion-label color="light">Members</ion-label>
            </ion-row>
          </super-tab-button>
        <!-- </div> -->
  
        <!-- <div style="width: 25%;"> -->
          <super-tab-button id="icon" style="justify-content: center;">
            <ion-row class="tabs-styling">
              <ion-icon class="icon-styling" color="light" style="margin-right:5px" name="person"></ion-icon>
              <ion-label color="light">Profile</ion-label>
            </ion-row>
          </super-tab-button>
        <!-- </div> -->

      <!-- </div> -->
      <div class="div"></div>
    </super-tabs-toolbar>

    <super-tabs-container>

      <super-tab>
        <ion-content>
          <!-- Home -->
          <ion-nav [root]="home"></ion-nav>
        </ion-content>
      </super-tab>

      <super-tab *ngIf="userRole === 'admin'">
        <ion-content>
          <!-- Statistics -->
          <ion-nav [root]="statistics"></ion-nav>
        </ion-content>
      </super-tab>

      <super-tab>
        <ion-content>
          <!-- members -->
          <ion-nav [root]="members"></ion-nav>
        </ion-content>
      </super-tab>


      <super-tab>
        <ion-content>
          <!-- profile -->
          <ion-nav [root]="profile"></ion-nav>
        </ion-content>
      </super-tab>
      
    </super-tabs-container>

  </super-tabs> 
</ion-content>
