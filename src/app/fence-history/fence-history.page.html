<ion-header>
  <ion-toolbar>
    <ion-title>Fence History</ion-title>
    <ion-icon (click)="closeModal()" class="ion-margin" slot="end" size="large" name="close"></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="2" offset="0">
        <ion-label>In: </ion-label>
      </ion-col>
      <ion-col class="ion-text-left">
        <ion-text>
          <b> 09:03 am </b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2" offset="0">
      </ion-col>
      <ion-col class="ion-text-left">
        <ion-text>
          <b> 11:05 am </b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2" offset="0">
        <ion-label>Out: </ion-label>
      </ion-col>
      <ion-col class="ion-text-left">
        <ion-text>
          <b> 02:30 pm </b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2" offset="0">
      </ion-col>
      <ion-col class="ion-text-left">
        <ion-text>
          <b> 04:00 pm </b>
        </ion-text>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
