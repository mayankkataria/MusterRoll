<form [formGroup]="adminForm" class="form">
  <ion-card class="card">
    <div class="div">
      <ion-label class="registration">Registration</ion-label>
      <div style="width: 70%;">
        <ion-item>
          <ion-label class="labels" position="floating" >Id</ion-label>
            <ion-input formControlName="id"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">First Name</ion-label>
            <ion-input formControlName="firstname"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Last Name</ion-label>
           <ion-input formControlName="lastname"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Organisation</ion-label>
            <ion-input formControlName="orgName"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Department</ion-label>
            <ion-input formControlName="department"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Designation</ion-label>
            <ion-input formControlName="designation"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Email</ion-label>
            <ion-input formControlName="email" type="email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label class="labels" position="floating">Password</ion-label>
             <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>
        <div class="button">
          <ion-button color="medium" (click)="register()" shape="round" expand="full">
            Register
          </ion-button>
          <div class="routing-button">
            <ion-label>Have an Account ? </ion-label>
            <!-- <span> -->
              <ion-buttons style="width: 30%;">
                <ion-button color="medium" [routerLink]="['/sign-in']">
                  Please Sign In
                </ion-button>
              </ion-buttons>
            <!-- </span> -->
          </div>
        </div>
      </div>
    </div>
  </ion-card>
</form>
