<ion-header>
  <ion-toolbar color="medium">
    <ion-back-button defaultHref="tabs/members" slot="start"></ion-back-button>
    <ion-title>Add Employee</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="employeeForm">
    <div class="info">
      <ion-label>General Information</ion-label>
    </div>
    <ion-card class="card">
        <ion-item>
          <ion-label position="floating">Employee Id<span class="required"> *</span></ion-label>
          <ion-input formControlName="id" type="text" clearInput></ion-input>
        </ion-item>
        <ion-row>
          <ion-col size="6">
            <ion-item>
              <ion-label position="floating">First Name<span class="required">*</span></ion-label>
              <ion-input formControlName="firstname" type="text"  clearInput></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item>
              <ion-label position="floating">Last Name<span class="required">*</span></ion-label>
              <ion-input formControlName="lastname" type="text"  clearInput></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-item>
          <ion-label position="floating">Email<span class="required">*</span></ion-label>
          <ion-input formControlName="email" type="email" clearInput></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Password<span class="required">*</span></ion-label>
          <ion-input formControlName="password" type="text" clearInput></ion-input>
        </ion-item>
    </ion-card>
    <div class="info">
      <ion-label>Position Information</ion-label>
    </div>
    <ion-card class="card">
      <ion-item>
        <ion-label position="floating">Department<span class="required">*</span></ion-label>
        <ion-input formControlName="department" type="text" clearInput></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Designation<span class="required">*</span></ion-label>
        <ion-input formControlName="designation" type="text"  clearInput></ion-input>
      </ion-item>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label>Salary:</ion-label>
            <ion-input formControlName="salary" type="number" clearInput></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
          <ion-select formControlName="perUnitTime" interface="popover" placeholder="per unit time">
            <ion-select-option value="hr">per hour</ion-select-option>
            <ion-select-option value="min">per minute</ion-select-option>
            <ion-select-option value="sec">per second</ion-select-option>
          </ion-select>
          </ion-item>
        </ion-col>
      </ion-row>
      <div class="div">
        <ion-label>Shift Timings:</ion-label>
      </div>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-datetime [pickerOptions]="shiftStartPicker" [(ngModel)]="shiftStart" formControlName="shiftStart" placeholder="From" displayFormat="hh:mm A"></ion-datetime>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
            <ion-datetime [pickerOptions]="shiftEndPicker" [(ngModel)]="shiftEnd" formControlName="shiftEnd" placeholder="To" displayFormat="hh:mm A"></ion-datetime>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label>Shift:</ion-label>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
            <ion-item>
              <ion-select class="shift-popover" formControlName="shift" class="shift-popover" interface="popover" placeholder="Select Shift">
                <ion-select-option value="first">First</ion-select-option>
                <ion-select-option value="second">Second</ion-select-option>
                <ion-select-option value="third">Third</ion-select-option>
                <ion-select-option value="morning">Morning</ion-select-option>
                <ion-select-option value="afternoon">Afternoon</ion-select-option>
                <ion-select-option value="evening">Evening</ion-select-option>
                <ion-select-option value="night">Night</ion-select-option>
                <ion-select-option value="midnight">Midnight</ion-select-option>
                <ion-select-option value="graveyard">Graveyard</ion-select-option>
                <ion-select-option value="split">Split</ion-select-option>
                <ion-select-option value="swing">Swing</ion-select-option>
                <ion-select-option value="rotating">Rotating</ion-select-option>
              </ion-select>
            </ion-item>
          </ion-item>
        </ion-col>
      </ion-row>
      <div class="btn-group">
        <ion-button (click)="cancelBtn()" color="warning" shape="round">
          Cancel
        </ion-button>
        <ion-button (click)="addEmployee()" type="submit" [disabled]="!employeeForm.valid" shape="round">
          Add
        </ion-button>
      </div>
    </ion-card>
    
  </form>
</ion-content>
