<ion-header>
  <ion-toolbar>
    <ion-title>Employee Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid fixed>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Status: </ion-label>
        <ion-text>
          <b>Late Comer</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Clock In: </ion-label>
        <ion-text>
          <b>09:05 am</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Clock Out: </ion-label>
        <ion-text>
          <b>04:05 pm</b>
        </ion-text>
      </ion-col>
    </ion-row>
    
    <ion-row>
      <ion-col offset="0">
        <ion-label>Duration: </ion-label>
        <ion-text>
          <b>6 hr 57 min</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Amount: </ion-label>
        <ion-text>
          <b>395 Rs</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <!-- <ion-row>
      <ion-col offset="0">
        <ion-label>Penalty: </ion-label>
        <ion-text>
          <b>45 Rs</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Bonus: </ion-label>
        <ion-text>
          <b>20 Rs</b>
        </ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col offset="0">
        <ion-label>Total Amount: </ion-label>
        <ion-text>
          <b>370 Rs</b>
        </ion-text>
      </ion-col>
    </ion-row> -->
    <ion-row>
      <ion-col class="ion-text-center">
        <ion-label (click)="openFenceHistory()" color="primary"> Fence History </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="ion-text-center">
        <ion-label *ngIf="inFence; else outsideFence" color="success"> <b> Inside Fence </b> </ion-label>
        <ng-template #outsideFence>
          <ion-label color="danger"> <b> Outside Fence </b> </ion-label>
        </ng-template>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="ion-text-center">
        <ion-label (click)="refreshLocation()" color="primary"> Refresh Location </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="ion-text-center">
        <ion-button [routerLink]="['/tabs/clock-in']" routerLinkActive="router-link-active"  [disabled]="!inFence">
          Clock In
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
