<ion-header>

  </ion-toolbar>
</ion-header>

<ion-content>

    <ion-item [routerLink]="['/geofence']" routerLinkActive="active">

      <ion-label> Sign Out </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
