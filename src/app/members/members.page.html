<ion-header>
  <ion-toolbar>
    <ion-title>Members</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-fab *ngIf="userRole === 'admin'" vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button [routerLink]="['/add-employee']"><ion-icon name="person-add"></ion-icon></ion-fab-button>
  </ion-fab>

  <ion-grid>
    <ion-row>
      <ion-col size="10">
        <ion-searchbar placeholder="Search Name" type="text"></ion-searchbar>
      </ion-col>
      <ion-col size="2">
        <ion-button color="light" (click)="openFilterModal()">
          <ion-icon name="funnel"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div *ngIf="members$">
    <ion-list>
        <ion-nav-link *ngFor="let member of members$ | async" router-direction="forward" [component]="othersProfilePage" [componentProps]="{memberUid: member.uid}" >
        <ion-item>
          <ion-avatar slot="start">
            <ion-img [src]="member.profilePicUrl ? member.profilePicUrl : 'assets/user.png'"></ion-img>
          </ion-avatar>
          <ion-label>
            <h2>{{ member.firstname | titlecase }} {{ member.lastname | titlecase }} </h2>
            <p>{{ member.designation | titlecase }}</p>
          </ion-label>
          <ion-badge slot="end" color="success" *ngIf="member.role === 'admin'">Admin</ion-badge> 
        </ion-item>
      </ion-nav-link>
    </ion-list>
  </div>
</ion-content>
