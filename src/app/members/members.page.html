<ion-header>
  <ion-toolbar>
    <ion-buttons slot="primary">
      <ion-button [hidden]="showSearchBar" (click)="clickedSearchIcon($event)">
        <ion-icon slot="icon-only" name="search"></ion-icon>
      </ion-button>
      <ion-button (click)="openFilterModal()">
        <ion-icon name="funnel"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title *ngIf="!showSearchBar">Members</ion-title>
    <ion-searchbar showCancelButton="focus" *ngIf="showSearchBar" [(ngModel)]="searchFieldValue" name="searchBar"
      (ionCancel)="cancelSearchBar()" (ionChange)="searchSuggest()" #searchBar placeholder="Search Members"
      animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-fab *ngIf="userRole === 'admin'" vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button [routerLink]="['/add-employee']">
      <ion-icon name="person-add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <div *ngIf="members$ && contentLoaded">
    <ion-list>
      <ion-nav-link *ngFor="let member of members$ | async" router-direction="forward" [component]="othersProfilePage"
        [componentProps]="{memberUid: member.uid}">
        <ion-item>
          <ion-avatar slot="start">
            <ion-img class="member-img" [src]="member.profilePicUrl ? member.profilePicUrl : 'assets/user.png'">
            </ion-img>
          </ion-avatar>
          <ion-label>
            <h2> <b> {{ member.firstname | titlecase }} {{ member.lastname | titlecase }} </b> </h2>
            <p>{{ member.designation | titlecase }}</p>
          </ion-label>
          <ion-badge slot="end" color="success" *ngIf="member.role === 'admin'">Admin</ion-badge>
        </ion-item>
      </ion-nav-link>
    </ion-list>
  </div>

  <div *ngIf="!contentLoaded && members$">
    <ion-list>
      <ion-nav-link *ngFor="let member of members$ | async" router-direction="forward" [component]="othersProfilePage"
        [componentProps]="{memberUid: member.uid}">
        <ion-item>
          <ion-avatar slot="start">
            <ion-skeleton-text animated></ion-skeleton-text>
          </ion-avatar>
          <ion-label>
            <h2>
              <ion-skeleton-text animated></ion-skeleton-text>
            </h2>
            <p>
              <ion-skeleton-text animated></ion-skeleton-text>
            </p>
          </ion-label>
          <ion-badge slot="end" color="success" *ngIf="member.role === 'admin'">
            <ion-skeleton-text animated></ion-skeleton-text>
          </ion-badge>
        </ion-item>
      </ion-nav-link>
    </ion-list>
  </div>
</ion-content>
