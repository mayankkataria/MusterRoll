<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      MusterRoll
    </ion-title>
    <ion-icon [routerLink]="['/tabs/statistics']" routerLinkActive="router-link-active"  slot="end" name="stats-chart" class="ion-margin"></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input [(ngModel)]="present" type="number" (ionChange)="modifyChart()" placeholder="Present(P)"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-input [(ngModel)]="absent" type="number" placeholder="Absent(A)"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-input [(ngModel)]="earlyLeavers" type="number" placeholder="Early leavers(EL)"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-input [(ngModel)]="lateComers" type="number" placeholder="Late Comers(LC)"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>


  <div class="pie-chart">
    <canvas baseChart 
    style="margin-top: 80px;"
    class="chart"
    [data]="pieChartData"
    [labels]="pieChartLabels"  
    [chartType]="chartType"
  >
    </canvas>
  </div>
</ion-content>
